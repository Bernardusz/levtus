# This workflow warns and then closes issues and PRs that have had no activity for a specified amount of time.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
  - cron: '45 2 * * *'

jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/stale@v9
      with:
        days-before-stale: 90
        days-before-close: 7
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: 'This issue has been inactive for 90 days and is now marked as stale. It will be closed in 7 days if no further activity occurs. Thank you for your contributions!'
        stale-pr-message: 'This pull request has been inactive for 90 days and is now marked as stale. It will be closed in 7 days if no further activity occurs. If you still want to merge this, please leave a comment or push a new commit.'
        stale-issue-label: 'stale'
        stale-pr-label: 'stale'
        exempt-issue-labels: 'pinned,security'
